name: CI Pipeline — AgricultPredict

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:

# ─────────────────────────────────────────
# JOB 1 : LINT
# ─────────────────────────────────────────
  lint:
    name: 🔍 Lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 backend/app.py --max-line-length=88

# ─────────────────────────────────────────
# JOB 2 : TESTS
# ─────────────────────────────────────────
  test:
    name: 🧪 Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest test.py -v

# ─────────────────────────────────────────
# JOB 3 : SONARQUBE
# ─────────────────────────────────────────
  sonarqube:
    name: 📊 SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

# ─────────────────────────────────────────
# JOB 4 : BUILD & PUSH DOCKER
# ─────────────────────────────────────────
  docker:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/agricult-predict:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/agricult-predict:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/agricult-predict:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agricult-predict:${{ github.sha }}

# ─────────────────────────────────────────
# JOB 5 : TRIVY SCAN (DevSecOps)
# ─────────────────────────────────────────
  trivy:
    name: 🔒 Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/agricult-predict:latest
          format: table
          exit-code: '1'
          severity: CRITICAL
