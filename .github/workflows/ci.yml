name: CI Pipeline AgricultPredict

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:

  lint:
    name: Lint flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 backend/app.py --max-line-length=88

  test:
    name: Tests pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd backend && pip install -r requirements.txt
      - run: cd backend && pytest test.py -v
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        run: |
          pip install sonar-scanner-python || true
          docker run \
            --rm \
            -e SONAR_HOST_URL="${{ secrets.SONAR_HOST_URL }}" \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -v "$(pwd):/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=zeinebdghais_AgricultPredict \
            -Dsonar.organization=zeinebdghais \
            -Dsonar.sources=backend \
            -Dsonar.host.url=https://sonarcloud.io
  docker:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -f docker/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/agricult-predict:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/agricult-predict:${{ github.sha }} \
            .
      - run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/agricult-predict:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agricult-predict:${{ github.sha }}

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/agricult-predict:latest
          format: table
          exit-code: '1'
          severity: CRITICAL
